name: E2E

# Manual: sobe o docker-compose.full.yml no runner (os 3 serviços, RabbitMQ e os 3 bancos),
# roda o seed e a saga de ponta a ponta (scripts/e2e_saga.py), da abertura da OS até Concluida,
# e a collection Postman da Fase 4 com o Newman.
on:
  workflow_dispatch:
    inputs:
      billing_ref:
        description: Branch, tag ou commit do oficina-billing-service
        default: main
      execution_ref:
        description: Branch, tag ou commit do oficina-execution-service
        default: main

permissions:
  contents: read

jobs:
  e2e:
    name: Saga de ponta a ponta (compose)
    runs-on: ubuntu-latest
    env:
      # Os outros dois repositórios ficam dentro do workspace, não ao lado.
      BILLING_DIR: ./_repos/oficina-billing-service
      EXECUTION_DIR: ./_repos/oficina-execution-service
    steps:
      - name: Checkout (os-service)
        uses: actions/checkout@v4

      - name: Checkout (billing-service)
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/oficina-billing-service
          ref: ${{ inputs.billing_ref }}
          path: _repos/oficina-billing-service

      - name: Checkout (execution-service)
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/oficina-execution-service
          ref: ${{ inputs.execution_ref }}
          path: _repos/oficina-execution-service

      - name: Subir o sistema
        run: docker compose -f docker-compose.full.yml up --build -d --wait --wait-timeout 300

      - name: Seed + saga
        run: python3 scripts/e2e_saga.py

      # A collection da Fase 4 (Etapa 6, 6.3) contra o mesmo compose: confere que ela está em dia
      # com as APIs. Relatório JUnit no artifact.
      - name: Collection Postman (Newman)
        run: >
          npx --yes newman@6.2.3 run postman/oficina-fase4.postman_collection.json
          -e postman/local.postman_environment.json
          --reporters cli,junit --reporter-junit-export newman/resultado.xml

      - name: Resultado do Newman
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: newman
          path: newman/
          if-no-files-found: ignore

      - name: Logs
        if: failure()
        run: docker compose -f docker-compose.full.yml logs --no-color --tail=200

      - name: Derrubar
        if: always()
        run: docker compose -f docker-compose.full.yml down -v
