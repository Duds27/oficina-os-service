name: CD

# Deploy no EKS a cada push em homolog ou prod. O job deploy só roda depois do CI (testes,
# cobertura >= 80% e quality gate do SonarCloud) passar no mesmo commit. Em homolog não há
# passo manual; em prod, o Environment exige aprovação (proteção da Etapa 4, 4.7).
on:
  push:
    branches: [ homolog, prod ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cd-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml
    secrets: inherit

  deploy:
    name: Deploy no EKS
    needs: ci
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name }}
    permissions:
      id-token: write # OIDC → role AWS
      contents: read
    env:
      APP: os-service
      NAMESPACE: oficina-os
      IMAGEM_KUSTOMIZE: oficina-os-service
      AWS_REGION: ${{ vars.AWS_REGION }}
      ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
      EKS_CLUSTER_NAME: ${{ vars.EKS_CLUSTER_NAME }}
      TARGET_GROUP_ARN: ${{ vars.TARGET_GROUP_ARN }}
      JWT_SECRET_ID: ${{ vars.JWT_SECRET_ID }}
      RABBITMQ_SECRET_ID: ${{ vars.RABBITMQ_SECRET_ID }}
      DB_SECRET_ID: ${{ vars.DB_SECRET_ID }}
      INTERNAL_KEY_SECRET_ID: ${{ vars.INTERNAL_KEY_SECRET_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Conferir as variables do Environment
        run: |
          faltando=""
          for v in AWS_REGION ECR_REPOSITORY EKS_CLUSTER_NAME TARGET_GROUP_ARN JWT_SECRET_ID RABBITMQ_SECRET_ID DB_SECRET_ID INTERNAL_KEY_SECRET_ID; do
            [ -n "${!v}" ] || faltando="$faltando $v"
          done
          if [ -n "$faltando" ]; then
            echo "::error::Variables sem valor no Environment ${{ github.ref_name }}:$faltando (veja o README, seção CD)."
            exit 1
          fi

      - name: Configurar credenciais AWS (OIDC)
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Login no ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7

      - name: Build e push da imagem
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          IMAGEM="$REGISTRY/$ECR_REPOSITORY:$GITHUB_SHA"
          # SERVICE_VERSION vira o service.version dos traces e métricas.
          docker build --build-arg SERVICE_VERSION="$GITHUB_SHA" -t "$IMAGEM" OficinaMecanicaBackend
          docker push "$IMAGEM"
          echo "IMAGEM=$IMAGEM" >> "$GITHUB_ENV"

      - name: Configurar kubeconfig do EKS
        run: aws eks update-kubeconfig --name "$EKS_CLUSTER_NAME" --region "$AWS_REGION"

      # Os valores saem do Secrets Manager direto para o Secret do pod, mascarados no log.
      - name: Secret do pod (Secrets Manager)
        env:
          NEW_RELIC_LICENSE_KEY: ${{ secrets.NEW_RELIC_LICENSE_KEY }}
          NEW_RELIC_OTLP_ENDPOINT: ${{ vars.NEW_RELIC_OTLP_ENDPOINT }}
        run: |
          set -euo pipefail
          ler() { aws secretsmanager get-secret-value --secret-id "$1" --query SecretString --output text; }
          campo() { local v; v=$(jq -r "$2 // empty" <<<"$1"); [ -n "$v" ] && echo "::add-mask::$v"; printf '%s' "$v"; }
          args=()

          MQ=$(ler "$RABBITMQ_SECRET_ID")
          args+=(--from-literal=RabbitMq__Username="$(campo "$MQ" .username)")
          args+=(--from-literal=RabbitMq__Password="$(campo "$MQ" .password)")

          JWT=$(ler "$JWT_SECRET_ID")
          args+=(--from-literal=Jwt__Key="$(campo "$JWT" .key)")

          # MySQL do oficina-infra-database: {host, port, username, password, dbname}.
          DB=$(ler "$DB_SECRET_ID")
          CONN="Server=$(campo "$DB" .host);Port=$(campo "$DB" .port);Database=$(campo "$DB" .dbname);User=$(campo "$DB" .username);Password=$(campo "$DB" .password);"
          echo "::add-mask::$CONN"
          args+=(--from-literal=ConnectionStrings__DefaultConnection="$CONN")

          # Senha do admin da equipe: opcional no mesmo secret do JWT ({"key","adminPassword"}).
          ADMIN=$(campo "$JWT" .adminPassword)
          if [ -n "$ADMIN" ]; then
            args+=(--from-literal=Jwt__AdminPassword="$ADMIN")
          fi

          # Chave do header X-Internal-Key, a mesma da Lambda de autenticação: {"key"}.
          INTERNA=$(ler "$INTERNAL_KEY_SECRET_ID")
          args+=(--from-literal=InternalApi__Key="$(campo "$INTERNA" .key)")

          # OpenTelemetry → New Relic por OTLP (traces, métricas e logs). Sem a license key, o
          # endpoint não é definido e nada é exportado. Conta na UE: NEW_RELIC_OTLP_ENDPOINT.
          if [ -n "${NEW_RELIC_LICENSE_KEY:-}" ]; then
            args+=(--from-literal=OTEL_EXPORTER_OTLP_ENDPOINT="${NEW_RELIC_OTLP_ENDPOINT:-https://otlp.nr-data.net:4317}")
            args+=(--from-literal=OTEL_EXPORTER_OTLP_HEADERS="api-key=$NEW_RELIC_LICENSE_KEY")
          fi

          kubectl -n "$NAMESPACE" create secret generic "$APP-secrets" "${args[@]}" \
            --dry-run=client -o yaml > /tmp/secret.yaml
          kubectl apply -f /tmp/secret.yaml
          # Vai na anotação do pod: credencial trocada sem mudança de código também reinicia os pods.
          echo "SECRET_HASH=$(sha256sum /tmp/secret.yaml | cut -c1-16)" >> "$GITHUB_ENV"
          rm -f /tmp/secret.yaml

      - name: Deploy (kustomize overlay aws)
        working-directory: k8s/overlays/aws
        run: |
          set -euo pipefail
          kustomize edit set image "$IMAGEM_KUSTOMIZE=$IMAGEM"
          sed -i "s|__TARGET_GROUP_ARN__|$TARGET_GROUP_ARN|g" targetgroupbinding.yaml
          # deployment.environment dos traces: homolog ou prod.
          sed -i "s|__AMBIENTE__|$GITHUB_REF_NAME|g" kustomization.yaml

          kustomize build . > /tmp/manifestos.yaml
          if grep -n '__[A-Z_]*__' /tmp/manifestos.yaml; then
            echo "::error::Placeholder sem valor nos manifestos (acima)."
            exit 1
          fi
          kubectl apply -f /tmp/manifestos.yaml
          kubectl -n "$NAMESPACE" patch deployment "$APP" --type merge \
            -p "{\"spec\":{\"template\":{\"metadata\":{\"annotations\":{\"oficina/secret-hash\":\"$SECRET_HASH\"}}}}}"
          kubectl -n "$NAMESPACE" rollout status deployment/"$APP" --timeout=300s

      - name: Smoke test (/health/ready)
        run: |
          kubectl -n "$NAMESPACE" run "smoke-$GITHUB_RUN_ID" --rm -i --restart=Never \
            --image=curlimages/curl:8.11.1 --command -- \
            curl -fsS --retry 5 --retry-delay 3 --retry-all-errors --max-time 10 "http://$APP/health/ready"

      - name: Recursos
        if: always()
        run: kubectl -n "$NAMESPACE" get pods,svc,hpa,targetgroupbinding -o wide || true
