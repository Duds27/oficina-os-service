# OpenTelemetry Collector local, do perfil "observabilidade" do docker-compose.full.yml.
# Recebe traces, métricas e logs dos 3 serviços por OTLP, no mesmo formato que vai para o
# New Relic no EKS, e os deixa consultáveis na máquina:
#   - traces: Jaeger (UI e API em http://localhost:16686);
#   - métricas: formato Prometheus em http://localhost:8889/metrics;
#   - logs: um JSON por linha em observabilidade/saida/logs.jsonl (pasta montada, fora do git).
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch: {}

exporters:
  otlp_grpc/jaeger:
    endpoint: jaeger:4317
    tls:
      insecure: true
  prometheus:
    endpoint: 0.0.0.0:8889
    resource_to_telemetry_conversion:
      enabled: true # service.name vira label de cada série
  file/logs:
    path: /saida/logs.jsonl

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlp_grpc/jaeger]
    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [prometheus]
    logs:
      receivers: [otlp]
      processors: [batch]
      exporters: [file/logs]
