apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Overlay AWS (EKS), usado pelo CD em homolog e prod:
#   - imagem do ECR: kustomize edit set image oficina-os-service=<ecr>/<repo>:<sha>;
#   - TargetGroupBinding: registra os pods no target group do serviço no NLB interno
#     (__TARGET_GROUP_ARN__ = saída target_group_arns do oficina-infra-k8s, trocada no CD);
#   - Secret os-service-secrets: criado pelo CD a partir do Secrets Manager (não fica aqui).
resources:
  - ../../base
  - targetgroupbinding.yaml

images:
  - name: oficina-os-service
    newName: oficina-os-service
    newTag: latest

patches:
  # Custo em homolog: 1 réplica, e o HPA sobe até 3 sob carga. Em prod, suba minReplicas.
  - target:
      kind: Deployment
      name: os-service
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
  - target:
      kind: HorizontalPodAutoscaler
      name: os-service
    patch: |-
      - op: replace
        path: /spec/minReplicas
        value: 1
      - op: replace
        path: /spec/maxReplicas
        value: 3
  - target:
      kind: ConfigMap
      name: os-service-config
    patch: |-
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: os-service-config
      data:
        NEW_RELIC_APP_NAME: "oficina-os-service"
