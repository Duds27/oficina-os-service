# RabbitMQ de desenvolvimento no namespace messaging, com o mesmo DNS do EKS
# (rabbitmq.messaging.svc.cluster.local). Uma réplica, sem volume e com um usuário só
# (oficina / oficina_dev), como nos composes. No EKS, o broker sobe pelo RabbitMQ Cluster
# Operator, com um usuário por serviço (oficina-infra-k8s).
# Os overlays locais do billing-service e do execution-service usam este broker.
apiVersion: v1
kind: Secret
metadata:
  name: rabbitmq-dev
  namespace: messaging
type: Opaque
stringData:
  password: "oficina_dev"
---
apiVersion: v1
kind: Service
metadata:
  name: rabbitmq
  namespace: messaging
  labels:
    app: rabbitmq
spec:
  selector:
    app: rabbitmq
  ports:
    - name: amqp
      port: 5672
    - name: management
      port: 15672
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rabbitmq
  namespace: messaging
  labels:
    app: rabbitmq
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rabbitmq
  template:
    metadata:
      labels:
        app: rabbitmq
    spec:
      containers:
        - name: rabbitmq
          image: rabbitmq:4.1-management
          ports:
            - name: amqp
              containerPort: 5672
            - name: management
              containerPort: 15672
          env:
            - name: RABBITMQ_DEFAULT_VHOST
              value: "oficina"
            - name: RABBITMQ_DEFAULT_USER
              value: "oficina"
            - name: RABBITMQ_DEFAULT_PASS
              valueFrom:
                secretKeyRef:
                  name: rabbitmq-dev
                  key: password
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              memory: "512Mi"
          readinessProbe:
            exec:
              command: ["rabbitmq-diagnostics", "-q", "ping"]
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 10
