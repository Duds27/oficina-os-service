apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Núcleo do os-service: clientes, veículos, catálogo, OS e orquestração da saga.
# O namespace oficina-os é criado pelo oficina-infra-k8s na AWS e pelo overlay local no kind.
# Secret (os-service-secrets) e banco ficam nos overlays.
namespace: oficina-os

labels:
  - pairs:
      app.kubernetes.io/part-of: oficina-mecanica
    includeSelectors: false

resources:
  - serviceaccount.yaml
  - configmap.yaml
  - deployment.yaml
  - service.yaml
  - hpa.yaml
